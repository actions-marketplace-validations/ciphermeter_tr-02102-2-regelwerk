# SPDX-License-Identifier: Apache-2.0
name: 'TLS check against BSI TR-02102-2'
description: 'Checks the TLS configuration of your own host against BSI TR-02102-2 (version 2026-01) using normal TLS handshakes only.'
branding:
  icon: 'lock'
  color: 'blue'
inputs:
  host:
    description: 'Hostname of the server to check (e.g. www.example.org). Only check hosts you own or are responsible for.'
    required: true
  port:
    description: 'TCP port'
    required: false
    default: '443'
  fail-on:
    description: 'none = never fail · warn = also fail on certificate findings without a TR requirement, TR deadlines ending this year or a limited measurement · fail = only on deviations from the TR or if no measurement is possible'
    required: false
    default: 'fail'
  sni:
    description: 'Different SNI name (optional, default: host)'
    required: false
    default: ''
outputs:
  result:
    description: 'pass, warn or fail'
    value: ${{ steps.pruefung.outputs.result }}
  findings:
    description: 'Number of findings (deviations from the TR + certificate findings without a TR requirement + TR deadlines ending this year)'
    value: ${{ steps.pruefung.outputs.findings }}
runs:
  using: composite
  steps:
    - id: pruefung
      shell: bash
      env:
        TR_HOST: ${{ inputs.host }}
        TR_PORT: ${{ inputs.port }}
        TR_FAIL_ON: ${{ inputs.fail-on }}
        TR_SNI: ${{ inputs.sni }}
        TR_REGELWERK: ${{ github.action_path }}/tr-02102-2-2026-01.json
      run: node "${{ github.action_path }}/action/run.js"
